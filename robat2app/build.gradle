plugins { id 'com.android.application' }

android {
    namespace 'com.robat2.mobile'
    compileSdk 35

    testOptions { unitTests.returnDefaultValues = true }

    defaultConfig {
        applicationId 'com.robat2.mobile'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '4.8-SEPARATE-VERIFIED-MODEL'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3' }
        }
    }

    androidResources {
        noCompress += ['gguf']
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

// The language model is downloaded on first use into app-private storage.
// Keeping it out of the APK prevents multi-gigabyte, fragile APK artifacts.

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
