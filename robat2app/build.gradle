plugins { id 'com.android.application' }

android {
    namespace 'com.robat2.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.robat2.mobile'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '3.0-OFFLINE'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3' }
        }
    }

    androidResources {
        noCompress += ['gguf']
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}
