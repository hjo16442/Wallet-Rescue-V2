plugins { id 'com.android.application' }
android {
 namespace 'com.walletrescue'
 compileSdk 35
 packaging { resources { pickFirsts += ['org/bouncycastle/x509/CertPathReviewerMessages_*.properties', 'META-INF/DISCLAIMER'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
 defaultConfig { applicationId 'com.walletrescue'; minSdk 24; targetSdk 35; versionCode 8; versionName '3.0-BTC' }
}
configurations.configureEach { exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18' }
configurations.configureEach {
 resolutionStrategy.eachDependency { details ->
  if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name in ['kotlin-stdlib','kotlin-stdlib-jdk7','kotlin-stdlib-jdk8']) {
   details.useVersion '1.8.22'; details.because 'Align Kotlin standard library modules to avoid duplicate classes'
  }
 }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.1'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 implementation 'org.bitcoinj:bitcoinj-core:0.16.3'
 implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}