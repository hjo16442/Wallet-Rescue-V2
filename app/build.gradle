
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.walletrescue'
    compileSdk 35

    packaging {
        resources {
            pickFirsts += ['org/bouncycastle/x509/CertPathReviewerMessages_*.properties', 'META-INF/DISCLAIMER']
        }
    }

    defaultConfig {
        applicationId 'com.walletrescue'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.3'
    }
}

configurations.configureEach {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
}

dependencies {
    implementation 'org.bitcoinj:bitcoinj-core:0.16.3'
    implementation 'org.web3j:core:4.12.3-android'
    implementation 'org.web3j:crypto:4.12.3'
    implementation 'org.web3j:utils:4.12.3'
}
