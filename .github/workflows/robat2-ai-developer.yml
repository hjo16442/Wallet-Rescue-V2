name: Robat2 AI Developer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: robat2-ai-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      github.event.issue.pull_request != null &&
      (github.event.comment.body == '/fix' || startsWith(github.event.comment.body, '/fix ') || startsWith(github.event.comment.body, '/fix\n')) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Wallet Rescue PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build AI engine
        working-directory: target
        run: mvn -B -q package

      - name: Run AI Developer
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          TARGET_DIR: .
        run: mvn -B -q exec:java -Dexec.mainClass="Main"
        continue-on-error: true

      - name: Build Android APKs
        working-directory: target
        run: gradle assembleDebug

      - name: Verify APKs
        working-directory: target
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s robat2app/build/outputs/apk/debug/robat2app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          file robat2app/build/outputs/apk/debug/robat2app-debug.apk

      - name: Upload Wallet Rescue APK
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-Rescue-APK
          path: target/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Robat2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Robat2-APK
          path: target/robat2app/build/outputs/apk/debug/robat2app-debug.apk
          if-no-files-found: error
          retention-days: 30
