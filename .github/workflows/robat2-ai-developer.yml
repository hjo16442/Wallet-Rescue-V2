name: Robat2 AI Developer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: robat2-ai-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      github.event.issue.pull_request != null &&
      (github.event.comment.body == '/fix' || startsWith(github.event.comment.body, '/fix ') || startsWith(github.event.comment.body, '/fix\n') || github.event.comment.body == '/audit' || startsWith(github.event.comment.body, '/audit ') || startsWith(github.event.comment.body, '/audit\n')) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Wallet Rescue PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build AI engine
        working-directory: target
        run: mvn -B -q package

      - name: Run AI Developer
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || 'openrouter,openai,groq,custom' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          TARGET_DIR: .
        id: ai
        run: |
          set -o pipefail
          mvn -B -q exec:java -Dexec.mainClass="Main" 2>&1 | tee ../robat2-ai.log
        continue-on-error: true

      - name: Build Android APKs
        working-directory: target
        run: gradle assembleDebug

      - name: Verify APKs
        working-directory: target
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s robat2app/build/outputs/apk/debug/robat2app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          file robat2app/build/outputs/apk/debug/robat2app-debug.apk

      - name: Upload Wallet Rescue APK
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-Rescue-APK
          path: target/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Robat2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Robat2-APK
          path: target/robat2app/build/outputs/apk/debug/robat2app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report AI failure without hiding it
        if: steps.ai.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue_number = context.issue.number;
            let details = 'فایل گزارش خطای AI در دسترس نیست.';
            try {
              const raw = fs.readFileSync('robat2-ai.log', 'utf8');
              details = raw.slice(-7000)
                .replace(/AIza[0-9A-Za-z_-]{20,}/g, '[REDACTED_API_KEY]')
                .replace(/gh[pousr]_[A-Za-z0-9_]{20,}/g, '[REDACTED_GITHUB_TOKEN]');
                .replace(/sk-[A-Za-z0-9_-]{20,}/g, '[REDACTED_PROVIDER_KEY]')
                .replace(/Bearer\\s+[A-Za-z0-9._-]{20,}/gi, 'Bearer [REDACTED]')
                .replace(/sk-or-v1-[A-Za-z0-9]{20,}/g, '[REDACTED_OPENROUTER_KEY]');
              details = details.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            } catch (error) {
              details = String(error.message || error);
            }
            const body = [
              '⚠️ **اجرای هوش مصنوعی Robat2 ناموفق بود.** ساخت و بررسی APKها مستقل ادامه یافت. وضعیت سبز Workflow فقط موفقیت ساخت و بارگذاری را نشان می‌دهد و به معنی موفقیت درخواست AI نیست.',
              '',
              '<details><summary>نمایش جزئیات واقعی خطا</summary>',
              '',
              '<pre>',
              details,
              '</pre>',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number, body });

      - name: Summarize AI result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.ai.outcome }}" = "failure" ]; then
            echo "❌ **Robat2 AI execution failed. APK packaging was attempted independently.**" >> "$GITHUB_STEP_SUMMARY"
            echo "AI failed; APK packaging result is reported by the build and verification steps."
          elif [ "${{ steps.ai.outcome }}" = "skipped" ]; then
            echo "ℹ️ **Robat2 AI step was skipped (build-only mode).**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **Robat2 AI execution completed successfully.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail workflow if AI request failed
        if: steps.ai.outcome == 'failure'
        shell: bash
        run: |
          echo "Robat2 AI failed. APKs may have been built, but the requested AI task was not completed."
          exit 1
