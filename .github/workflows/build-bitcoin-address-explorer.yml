name: Build Bitcoin Address Explorer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BitcoinAddressExplorer/**'
      - '.github/workflows/build-bitcoin-address-explorer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build standalone APK
        run: gradle -p BitcoinAddressExplorer :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Address-Explorer-debug
          path: BitcoinAddressExplorer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
