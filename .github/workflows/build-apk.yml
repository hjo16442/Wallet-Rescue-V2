name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/robat2-android-app
      - feature/robat2-full-audit-v2
      - feature/robat2-offline-ai
      - feature/robat2-downloadable-deliverables
  pull_request:
    branches:
      - main
      - feature/robat2-full-audit-v2
      - feature/robat2-offline-ai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android native build tools
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Robat2 APK without bundling the language model
        run: gradle :robat2app:assembleDebug --no-daemon
      - name: Compile Robat2 AI engine
        run: mvn -B -q package
      - name: Run Gradle unit tests
        run: gradle test
      - name: Build APKs
        run: gradle assembleDebug
      - name: Verify APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s robat2app/build/outputs/apk/debug/robat2app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          file robat2app/build/outputs/apk/debug/robat2app-debug.apk
          test "$(stat -c%s robat2app/build/outputs/apk/debug/robat2app-debug.apk)" -lt 100000000
          if unzip -l robat2app/build/outputs/apk/debug/robat2app-debug.apk | grep -qi '\.gguf'; then
            echo "Unexpected GGUF model found inside APK"
            exit 1
          fi
      - name: Package downloadable source files and full project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/Full-Project-Source.zip HEAD
          git ls-files -z -- '*.java' '*.kt' '*.xml' '*.gradle' '*.properties' '*.cpp' '*.h' '*.c' '*.cmake' '*.py' '*.md' '*.yml' '*.yaml' '*.json' \
            | xargs -0 -r zip -q dist/Source-Files.zip
          test -s dist/Full-Project-Source.zip
          test -s dist/Source-Files.zip
          cp app/build/outputs/apk/debug/app-debug.apk dist/Wallet-Rescue.apk
          cp robat2app/build/outputs/apk/debug/robat2app-debug.apk dist/Robat2.apk
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Upload Wallet Rescue APK
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-Rescue-APK
          path: dist/Wallet-Rescue.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Robat2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Robat2-APK
          path: dist/Robat2.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload source files ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Source-Files-ZIP
          path: |
            dist/Source-Files.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload full project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Full-Project-ZIP
          path: |
            dist/Full-Project-Source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish all downloads
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/robat2-full-audit-v2' || github.ref == 'refs/heads/feature/robat2-offline-ai' || github.ref == 'refs/heads/feature/robat2-downloadable-deliverables'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Android downloads #${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            dist/Robat2.apk
            dist/Wallet-Rescue.apk
            dist/Source-Files.zip
            dist/Full-Project-Source.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Robat2 APK build verification and downloadable deliverables
