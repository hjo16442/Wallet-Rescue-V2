name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/robat2-android-app
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Robat2 AI engine
        run: mvn -B -q package
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APKs
        run: gradle assembleDebug
      - name: Verify APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s robat2app/build/outputs/apk/debug/robat2app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          file robat2app/build/outputs/apk/debug/robat2app-debug.apk
      - name: Upload Robat2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Robat2-APK
          path: robat2app/build/outputs/apk/debug/robat2app-debug.apk
          if-no-files-found: error
      - name: Upload Wallet Rescue APK
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-Rescue-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK downloads
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Android APKs #${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            robat2app/build/outputs/apk/debug/robat2app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Robat2 APK build verification trigger
